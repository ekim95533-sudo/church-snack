<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>간식 당번 관리</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; background: #fef9f2; }
    .app { max-width: 420px; margin: 0 auto; min-height: 100vh; }
    button { cursor: pointer; font-family: inherit; }
    .notif { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); padding: 10px 20px; border-radius: 20px; font-size: 13px; font-weight: 600; z-index: 1000; box-shadow: 0 4px 16px rgba(0,0,0,0.15); white-space: nowrap; color: white; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, push, update, remove, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    databaseURL: "https://church-snack-default-rtdb.firebaseio.com"
  };
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const MEMBERS = ["이수화", "박보연", "정소영", "박경애", "김순화", "김상희"];
  const BASE_SUNDAY = "2026-05-03";

  function getTodayDayCST() {
    const cst = new Date(new Date().toLocaleString("en-US", { timeZone: "America/Chicago" }));
    return cst.getDay();
  }

  function getTodayStrCST() {
    const cst = new Date(new Date().toLocaleString("en-US", { timeZone: "America/Chicago" }));
    return `${cst.getFullYear()}-${String(cst.getMonth()+1).padStart(2,"0")}-${String(cst.getDate()).padStart(2,"0")}`;
  }

  function parseDate(str) {
    const [y,m,d] = str.split("-").map(Number);
    return new Date(y, m-1, d);
  }

  function getSundayStr() {
    const day = getTodayDayCST();
    const d = parseDate(getTodayStrCST());
    d.setDate(d.getDate() + (day === 0 ? 0 : 7 - day));
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  }

  function formatDate(str) {
    const [,m,d] = str.split("-");
    return `${parseInt(m)}월 ${parseInt(d)}일 (주일)`;
  }

  function generateSchedule() {
    const base = parseDate(BASE_SUNDAY);
    return Array.from({length: 16}, (_,i) => i-2).map(i => {
      const d = new Date(base.getFullYear(), base.getMonth(), base.getDate() + i*7);
      const sunday = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
      return { sunday, memberIndex: ((i % MEMBERS.length) + MEMBERS.length) % MEMBERS.length };
    });
  }

  let state = {
    currentUser: null,
    swapRequests: [],
    activeTab: "schedule",
    showSwapForm: false,
    swapForm: { myWeek: "", reason: "" },
    acceptModal: null,
    notification: null,
  };

  const schedule = generateSchedule();
  const todaySunday = getSundayStr();

  // Firebase 실시간 연결
  onValue(ref(db, "swapRequests"), (snapshot) => {
    const data = snapshot.val();
    if (data) {
      state.swapRequests = Object.entries(data)
        .map(([firebaseId, val]) => ({ ...val, firebaseId }))
        .sort((a, b) => b.id - a.id);
    } else {
      state.swapRequests = [];
    }
    render();
  });

  function getEffectiveMember(sundayStr) {
    const approved = state.swapRequests.find(r =>
      r.status === "approved" && (r.myWeek === sundayStr || r.targetWeek === sundayStr)
    );
    if (approved) {
      if (approved.myWeek === sundayStr) return approved.acceptor;
      if (approved.targetWeek === sundayStr) return approved.requester;
    }
    const entry = schedule.find(s => s.sunday === sundayStr);
    return entry ? MEMBERS[entry.memberIndex] : null;
  }

  function showNotif(msg, type = "success") {
    state.notification = { msg, type };
    render();
    setTimeout(() => { state.notification = null; render(); }, 2800);
  }

  function setState(updates) {
    state = { ...state, ...updates };
    render();
  }

  async function handleSwapRequest() {
    if (!state.swapForm.myWeek || !state.swapForm.reason.trim()) {
      showNotif("날짜와 사유를 모두 입력해주세요.", "error"); return;
    }
    await push(ref(db, "swapRequests"), {
      id: Date.now(),
      requester: state.currentUser,
      myWeek: state.swapForm.myWeek,
      reason: state.swapForm.reason,
      status: "pending",
      targetWeek: null,
      acceptor: null,
    });
    setState({ swapForm: { myWeek: "", reason: "" }, showSwapForm: false });
    showNotif("교환 요청 등록! 다른 분들께 바로 보여요 😊");
  }

  async function handleAcceptConfirm(reqId, selectedWeek) {
    const req = state.swapRequests.find(r => r.id === reqId);
    if (!req || !selectedWeek) return;
    await update(ref(db, `swapRequests/${req.firebaseId}`), {
      status: "approved", acceptor: state.currentUser, targetWeek: selectedWeek
    });
    setState({ acceptModal: null });
    showNotif("교환 완료! 일정에 바로 반영됐어요 😊");
  }

  async function handleCancel(req) {
    await remove(ref(db, `swapRequests/${req.firebaseId}`));
    showNotif("요청이 취소됐어요.", "error");
  }

  function render() {
    const root = document.getElementById("root");
    if (!state.currentUser) {
      root.innerHTML = `
        <div style="min-height:100vh;background:linear-gradient(135deg,#fef9f0,#fde8c8,#fcd5a0);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;">
          <div style="text-align:center;margin-bottom:40px;">
            <div style="font-size:48px;margin-bottom:12px">🍞</div>
            <h1 style="font-size:26px;font-weight:700;color:#5c3a1e">간식 당번 관리</h1>
            <p style="color:#9c6b3c;margin-top:8px;font-size:14px">누구세요?</p>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:320px">
            ${MEMBERS.map(name => `
              <button onclick="selectUser('${name}')" style="padding:16px 8px;border-radius:14px;border:2px solid #f0d4a8;background:white;color:#5c3a1e;font-size:15px;font-weight:600;box-shadow:0 2px 8px rgba(92,58,30,0.08)">${name}</button>
            `).join("")}
          </div>
        </div>`;
      return;
    }

    const upcomingSchedule = schedule.filter(s => s.sunday >= todaySunday);
    const myUpcoming = upcomingSchedule.filter(s => getEffectiveMember(s.sunday) === state.currentUser);
    const pendingForMe = state.swapRequests.filter(r => r.status === "pending" && r.requester !== state.currentUser);
    const thisWeekMember = getEffectiveMember(todaySunday);
    const isMyTurn = thisWeekMember === state.currentUser;

    const notifHtml = state.notification ? `
      <div class="notif" style="background:${state.notification.type === "error" ? "#ef4444" : "#22c55e"}">${state.notification.msg}</div>
    ` : "";

    let modalHtml = "";
    if (state.acceptModal) {
      const req = state.swapRequests.find(r => r.id === state.acceptModal.reqId);
      if (req) {
        const myWeeks = upcomingSchedule.filter(s => getEffectiveMember(s.sunday) === state.currentUser && s.sunday !== req.myWeek);
        modalHtml = `
          <div style="position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:200;display:flex;align-items:center;justify-content:center;padding:24px">
            <div style="background:white;border-radius:20px;padding:24px;width:100%;max-width:340px;box-shadow:0 8px 32px rgba(0,0,0,0.18)">
              <p style="font-size:16px;font-weight:700;color:#3d2008;margin:0 0 6px">교환 수락</p>
              <p style="font-size:13px;color:#9c8060;margin:0 0 16px;line-height:1.6">
                <b>${req.requester}</b>님의 <b>${formatDate(req.myWeek)}</b> 당번을 내가 맡고,<br>내 당번 날짜에 ${req.requester}님이 대신 해줘요.
              </p>
              <p style="font-size:12px;font-weight:700;color:#7a5c3a;margin:0 0 8px">내 당번 중 바꿀 날짜 선택</p>
              ${myWeeks.length === 0 ? `<p style="color:#ef4444;font-size:13px;margin:0 0 16px">교환할 수 있는 내 당번이 없어요.</p>` :
                myWeeks.map(s => `
                  <button onclick="selectAcceptWeek('${s.sunday}')" style="width:100%;padding:11px 14px;border-radius:10px;text-align:left;margin-bottom:8px;border:${state.acceptModal.selectedWeek === s.sunday ? "2px solid #c8860a" : "1px solid #f0e8d8"};background:${state.acceptModal.selectedWeek === s.sunday ? "#fef3e2" : "white"};color:#3d2008;font-size:14px;font-weight:600">
                    ${state.acceptModal.selectedWeek === s.sunday ? "✓ " : ""}${formatDate(s.sunday)}
                  </button>`).join("")}
              <div style="display:flex;gap:8px;margin-top:4px">
                <button onclick="confirmAccept(${req.id})" style="flex:1;background:${state.acceptModal.selectedWeek ? "#c8860a" : "#e0c89a"};color:white;border:none;border-radius:10px;padding:11px;font-size:13px;font-weight:700">교환 확정</button>
                <button onclick="closeModal()" style="flex:1;background:#f0e8d8;color:#7a5c3a;border:none;border-radius:10px;padding:11px;font-size:13px;font-weight:600">취소</button>
              </div>
            </div>
          </div>`;
      }
    }

    let tabContent = "";

    if (state.activeTab === "schedule") {
      tabContent = `
        <h3 style="font-size:14px;color:#7a5c3a;margin:0 0 12px;font-weight:600">앞으로의 일정</h3>
        ${upcomingSchedule.slice(0, 8).map(entry => {
          const member = getEffectiveMember(entry.sunday);
          const isToday = entry.sunday === todaySunday;
          const isMe = member === state.currentUser;
          return `<div style="background:${isToday?"#fef3e2":"white"};border:${isToday?"2px solid #e8a020":"1px solid #f0e8d8"};border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between">
            <div>
              <p style="margin:0;font-size:12px;color:#9c8060">${formatDate(entry.sunday)}</p>
              <p style="margin:3px 0 0;font-size:16px;font-weight:600;color:#3d2008">${member}${isMe ? `<span style="font-size:11px;color:#c8860a;margin-left:6px">나</span>` : ""}</p>
            </div>
            ${isToday ? `<span style="font-size:18px">📍</span>` : ""}
          </div>`;
        }).join("")}`;
    }

    if (state.activeTab === "swap") {
      const formHtml = state.showSwapForm ? `
        <div style="background:#fef9f0;border:1px solid #f0d4a8;border-radius:14px;padding:16px;margin-bottom:14px">
          <p style="font-size:13px;font-weight:700;color:#5c3a1e;margin:0 0 12px">교환 요청 작성</p>
          <select id="swapWeek" onchange="updateSwapWeek(this.value)" style="width:100%;padding:10px;border-radius:10px;border:1px solid #f0d4a8;font-size:13px;margin-bottom:10px;background:white;color:#3d2008">
            <option value="">내 당번 날짜 선택</option>
            ${upcomingSchedule.filter(s => getEffectiveMember(s.sunday) === state.currentUser).map(s => `<option value="${s.sunday}" ${state.swapForm.myWeek === s.sunday ? "selected" : ""}>${formatDate(s.sunday)}</option>`).join("")}
          </select>
          <textarea id="swapReason" onchange="updateSwapReason(this.value)" placeholder="교환 사유를 입력해주세요..." rows="3" style="width:100%;padding:10px;border-radius:10px;border:1px solid #f0d4a8;font-size:13px;margin-bottom:10px;resize:none;color:#3d2008">${state.swapForm.reason}</textarea>
          <div style="display:flex;gap:8px">
            <button onclick="submitSwap()" style="flex:1;background:#c8860a;color:white;border:none;border-radius:10px;padding:10px;font-size:13px;font-weight:600">등록</button>
            <button onclick="closeSwapForm()" style="flex:1;background:#f0e8d8;color:#7a5c3a;border:none;border-radius:10px;padding:10px;font-size:13px;font-weight:600">취소</button>
          </div>
        </div>` : "";

      const requestsHtml = state.swapRequests.length === 0 ?
        `<div style="text-align:center;padding:40px 0;color:#c4a882"><p style="font-size:32px;margin:0 0 8px">🕊️</p><p style="font-size:13px">교환 요청이 없어요</p></div>` :
        state.swapRequests.map(req => `
          <div style="background:white;border:${req.status==="approved"?"1px solid #86efac":req.requester===state.currentUser?"1px solid #fcd34d":"1px solid #bfdbfe"};border-radius:14px;padding:14px;margin-bottom:10px">
            <span style="font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;background:${req.status==="approved"?"#dcfce7":req.requester===state.currentUser?"#fef9c3":"#eff6ff"};color:${req.status==="approved"?"#16a34a":req.requester===state.currentUser?"#ca8a04":"#2563eb"};margin-bottom:6px;display:inline-block">
              ${req.status==="approved"?"✅ 교환 완료":req.requester===state.currentUser?"⏳ 내 요청":"🙋 도움 요청"}
            </span>
            <p style="margin:4px 0 2px;font-size:14px;font-weight:600;color:#3d2008">${req.requester} · ${formatDate(req.myWeek)}</p>
            <p style="margin:0;font-size:12px;color:#9c8060">사유: ${req.reason}</p>
            ${req.status==="approved" ? `
              <div style="margin-top:8px;background:#f0fdf4;border-radius:8px;padding:8px 10px">
                <p style="margin:0;font-size:12px;color:#16a34a;font-weight:600;line-height:1.6">🔄 ${req.requester} (${formatDate(req.myWeek)})<br>&nbsp;&nbsp;&nbsp;↔ ${req.acceptor} (${formatDate(req.targetWeek)})</p>
              </div>` : ""}
            ${req.status==="pending" && req.requester !== state.currentUser ? `
              <button onclick="openAcceptModal(${req.id})" style="margin-top:10px;width:100%;background:#c8860a;color:white;border:none;border-radius:10px;padding:9px;font-size:13px;font-weight:600">내가 대신할게요!</button>` : ""}
            ${req.status==="pending" && req.requester === state.currentUser ? `
              <button onclick="cancelRequest('${req.firebaseId}')" style="margin-top:10px;width:100%;background:#fef2f2;color:#ef4444;border:none;border-radius:10px;padding:9px;font-size:13px;font-weight:600">요청 취소</button>` : ""}
          </div>`).join("");

      tabContent = `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
          <h3 style="font-size:14px;color:#7a5c3a;margin:0;font-weight:600">교환 요청</h3>
          <button onclick="toggleSwapForm()" style="background:#c8860a;color:white;border:none;border-radius:10px;padding:7px 14px;font-size:12px;font-weight:600">+ 요청하기</button>
        </div>
        ${formHtml}${requestsHtml}`;
    }

    if (state.activeTab === "my") {
      tabContent = `
        <h3 style="font-size:14px;color:#7a5c3a;margin:0 0 12px;font-weight:600">${state.currentUser}님의 앞으로 당번</h3>
        ${myUpcoming.length === 0 ?
          `<div style="text-align:center;padding:40px 0;color:#c4a882"><p style="font-size:32px;margin:0 0 8px">😴</p><p style="font-size:13px">당분간 당번이 없어요!</p></div>` :
          myUpcoming.map(entry => {
            const isToday = entry.sunday === todaySunday;
            return `<div style="background:${isToday?"#fef3e2":"white"};border:${isToday?"2px solid #e8a020":"1px solid #f0e8d8"};border-radius:14px;padding:16px;margin-bottom:10px;display:flex;align-items:center;gap:14px">
              <span style="font-size:28px">${isToday?"🍪":"📅"}</span>
              <div>
                <p style="margin:0;font-size:15px;font-weight:700;color:#3d2008">${formatDate(entry.sunday)}</p>
                ${isToday?`<p style="margin:3px 0 0;font-size:12px;color:#c8860a;font-weight:600">이번 주일이에요! 간식 준비 잊지 마세요 😊</p>`:""}
              </div>
            </div>`;
          }).join("")}`;
    }

    root.innerHTML = `
      ${notifHtml}
      ${modalHtml}
      <div class="app">
        <div style="background:linear-gradient(135deg,#c8860a,#e8a020);padding:20px 20px 28px;position:relative;overflow:hidden">
          <div style="position:absolute;top:-20px;right:-20px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,0.1)"></div>
          <div style="display:flex;justify-content:space-between;align-items:flex-start">
            <div>
              <p style="color:rgba(255,255,255,0.8);font-size:12px;margin:0">안녕하세요 👋</p>
              <h2 style="color:white;font-size:20px;font-weight:700;margin:4px 0 0">${state.currentUser}님</h2>
            </div>
            <button onclick="logout()" style="background:rgba(255,255,255,0.2);border:none;border-radius:10px;color:white;padding:6px 12px;font-size:12px">로그아웃</button>
          </div>
          <div style="margin-top:18px;background:white;border-radius:16px;padding:16px;box-shadow:0 4px 16px rgba(0,0,0,0.12)">
            <p style="color:#9c6b3c;font-size:11px;font-weight:600;margin:0 0 6px">이번 주일 당번 (${formatDate(todaySunday)})</p>
            <div style="display:flex;align-items:center;gap:10px">
              <span style="font-size:28px">🍪</span>
              <div>
                <p style="margin:0;font-size:20px;font-weight:700;color:#3d2008">${thisWeekMember}</p>
                ${isMyTurn?`<span style="background:#fef3e2;color:#c8860a;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px">내 차례예요!</span>`:""}
              </div>
            </div>
          </div>
        </div>

        <div style="display:flex;background:white;border-bottom:1px solid #f0e8d8;position:sticky;top:0;z-index:10">
          ${[
            { key:"schedule", label:"📅 일정" },
            { key:"swap", label:`🔄 교환${pendingForMe.length > 0 ? ` (${pendingForMe.length})` : ""}` },
            { key:"my", label:"👤 내 당번" }
          ].map(tab => `
            <button onclick="setTab('${tab.key}')" style="flex:1;padding:13px 4px;border:none;background:none;font-size:13px;font-weight:${state.activeTab===tab.key?"700":"400"};color:${state.activeTab===tab.key?"#c8860a":"#9c8060"};border-bottom:${state.activeTab===tab.key?"2px solid #c8860a":"2px solid transparent"}">${tab.label}</button>
          `).join("")}
        </div>

        <div style="padding:16px">${tabContent}</div>
      </div>`;
  }

  // 전역 함수
  window.selectUser = (name) => setState({ currentUser: name });
  window.logout = () => setState({ currentUser: null });
  window.setTab = (tab) => setState({ activeTab: tab });
  window.toggleSwapForm = () => setState({ showSwapForm: !state.showSwapForm });
  window.closeSwapForm = () => setState({ showSwapForm: false });
  window.updateSwapWeek = (val) => setState({ swapForm: { ...state.swapForm, myWeek: val } });
  window.updateSwapReason = (val) => setState({ swapForm: { ...state.swapForm, reason: val } });
  window.submitSwap = () => handleSwapRequest();
  window.openAcceptModal = (reqId) => setState({ acceptModal: { reqId, selectedWeek: null } });
  window.selectAcceptWeek = (week) => setState({ acceptModal: { ...state.acceptModal, selectedWeek: week } });
  window.confirmAccept = (reqId) => handleAcceptConfirm(reqId, state.acceptModal?.selectedWeek);
  window.closeModal = () => setState({ acceptModal: null });
  window.cancelRequest = async (firebaseId) => {
    await remove(ref(db, `swapRequests/${firebaseId}`));
    showNotif("요청이 취소됐어요.", "error");
  };

  render();
</script>
</body>
</html>
